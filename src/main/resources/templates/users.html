<!DOCTYPE html>
<html lang="et" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kasutajad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Kasutajad</h1>
            <p class="text-secondary mb-0">Spring Booti kasutajate haldus</p>
        </div>
        <a class="btn btn-primary" th:href="@{/users/new}">Lisa kasutaja</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Eesnimi</th>
                    <th scope="col">Perekonnanimi</th>
                    <th scope="col">E-post</th>
                    <th scope="col" class="text-end">Tegevused</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.firstName}"></td>
                    <td th:text="${user.lastName}"></td>
                    <td th:text="${user.email}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/users/edit/{id}(id=${user.id})}">Muuda</a>
                        <form class="d-inline" method="post"
                              th:action="@{/users/delete/{id}(id=${user.id})}"
                              onsubmit="return confirm('Kas soovid selle kasutaja kustutada?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Kustuta</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td class="text-center text-secondary py-4" colspan="5">Kasutajaid pole veel lisatud.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
